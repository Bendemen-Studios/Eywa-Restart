name: Build EywaRestart
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build plugin
        run: mvn --batch-mode clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EywaRestart-1.0.0
          path: target/EywaRestart-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
