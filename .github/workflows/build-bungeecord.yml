name: Build EywaRestart BungeeCord
on:
  push:
    branches: [main]
    paths:
      - 'bungeecord/**'
      - '.github/workflows/build-bungeecord.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: bungeecord/pom.xml
      - name: Build BungeeCord plugin
        run: mvn --batch-mode -f bungeecord/pom.xml clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EywaRestart-BungeeCord-1.0.0
          path: bungeecord/target/EywaRestart-BungeeCord-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
